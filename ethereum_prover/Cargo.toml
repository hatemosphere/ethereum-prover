[package]
name = "ethereum_prover"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1"
alloy = { version = "2.4.1", features = ["rlp", "full", "ssz", "eips"] }
bincode = { version = "2", features = ["serde"] }
base64 = "0.21.7"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
reqwest = { version = "0.12", features = ["json"] }
ruint = { workspace = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
thiserror = "1"

# The v3 stack (zksync-os `av_integrate_v3`, airbender-platform, zksync-airbender v3) refers
# to its parts by sibling path, so they are taken from sibling checkouts of this repository.
forward_system = { path = "../../zksync-os/forward_system", features = ["no_print", "eth_runner", "eth_stf", "fusaka-bpo-2"] }
oracle_provider = { path = "../../zksync-os/oracle_provider" }
callable_oracles = { path = "../../zksync-os/callable_oracles" }
zk_ee = { path = "../../zksync-os/zk_ee" }
basic_system = { path = "../../zksync-os/basic_system" }
basic_bootloader = { path = "../../zksync-os/basic_bootloader", features = ["verify_intrinsic_native"] }
system_hooks = { path = "../../zksync-os/system_hooks" }
crypto = { path = "../../airbender-platform/crates/airbender-crypto", package = "airbender-crypto" }
zksync_os_interface = "0.1.3"
airbender-host = { path = "../../airbender-platform/crates/airbender-host" }
prover_pipeline = { path = "../../zksync-airbender/prover_pipeline", default-features = false }
full_statement_verifier = { path = "../../zksync-airbender/full_statement_verifier", default-features = false, features = ["host_utils"] }
smart-config = "0.4.0-pre.1"
serde_yaml = "0.9.34"
futures = "0.3.31"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
url = "2"
sentry = { version = "0.32", default-features = false, features = ["anyhow", "panic", "transport"] }
sentry-anyhow = "0.32"
vise = "0.3.2"
vise-exporter = "0.3.2"

[dev-dependencies]
tempfile = "3"

# [features]
# with_gpu_prover = ["execution_utils", "execution_utils/prover", "execution_utils/gpu_prover", "risc_v_simulator"]
