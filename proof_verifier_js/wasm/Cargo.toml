[package]
name = "proof_verifier_wasm"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"

# Disabling `wasm-opt` makes the build faster, but the resulting wasm file is much larger.
# Uncommented now, because it takes too much time in CI -- dependency graph should be optimized,
# so that it doesn't take forever. In case of new release requied, comment the lines below.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bincode = { version = "2", features = ["serde"] }
flate2 = "1"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"

full_statement_verifier = { path = "../../../zksync-airbender/full_statement_verifier", default-features = false, features = ["unified_verifier_only"] }
